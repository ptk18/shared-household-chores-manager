{% extends 'chores/base.html' %}

{% block title %}Sign in{% endblock %}
{% block heading %}Sign in{% endblock %}

{% block content %}
<section class="panel">
  {% if form.errors %}<p class="empty">That username and password did not match.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="action" type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
